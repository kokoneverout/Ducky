[package]
name = "swiftclip"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"

[dependencies]
anyhow = "1"
ely-core = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "dbfdf0ce7ff2d4328f00ea5b00bfa8f3aa504e42", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures = "0.3"
time = { version = "0.3", features = ["formatting", "local-offset"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

