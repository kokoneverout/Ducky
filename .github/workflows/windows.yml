name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p ducky
      - run: cargo test --locked -p swiftclip --lib
      - run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: Ducky-windows-x64
          path: target/release/ducky.exe
          if-no-files-found: error
